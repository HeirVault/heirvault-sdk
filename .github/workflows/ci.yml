name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    name: SDK (typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    needs: sdk
    defaults:
      run:
        working-directory: HeirVault-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The frontend depends on the SDK via `file:..`, so build the SDK first.
      - name: Build SDK (dependency)
        working-directory: .
        run: |
          npm ci
          npm run build
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
